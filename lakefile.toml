name = "darbouxlean"
version = "0.1.0"
defaultTargets = ["DarbouxLean", "Challenge", "Solution"]

[leanOptions]
autoImplicit = false
# Challenge.lean keeps lean-eval's text, which has no Mathlib-style copyright header.
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "5e0c4e5239cb0a2d86d68a884bf52cfd963fce22"

[[lean_lib]]
name = "DarbouxLean"

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
