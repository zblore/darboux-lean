version: "v0.4"

# Zayn Blore's ORCID: 0009-0009-8447-7247

project:
  name: "Darboux's theorem: every symplectic form on an open subset of R^2n is locally the standard one"
  description: >-
    A machine-checked proof of Darboux's theorem in the form Kim Morrison stated it for lean-eval
    (problem darboux): if a 2-form on an open set U of R^2n is smooth, closed and non-degenerate,
    then every point of U has a neighbourhood with a smooth chart, smooth in both directions, in
    which the form takes the standard values on the standard basis, so it is the standard
    symplectic form sum dx_i ^ dx_(n+i). The proof is Moser's: interpolate between the form and
    its value at the point, write the difference as d(beta) by a Poincare lemma, integrate the
    vector field X_t with i_(X_t) omega_t = -beta to time 1, and get a chart from the inverse
    function theorem; a symplectic basis of the form at the point then gives the standard
    coordinates. Mathlib has no symplectic forms and no Darboux theorem. When lean-eval posed the
    problem in May 2026 it found no formalization in any proof assistant; since then three other
    Lean proofs of Darboux's theorem have appeared, each with its own statement (listed under
    related_formalizations). This proof is independent of them. The theorem is classical and no
    priority is claimed.
  authors:
    - "Zayn Blore"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Zayn Blore"

sources:
  - title: "Sur le probleme de Pfaff"
    authors:
      - "Gaston Darboux"
    type: "paper"
    location: >-
      Bull. Sci. Math. 6 (1882), 14-36 and 49-68. The theorem. Cited by me, not by lean-eval,
      whose problem cites only Knill. Not read for this entry.
    relationship: "formalizes"
    author_endorsement: "n/a"
  - title: "On the volume elements on a manifold"
    authors:
      - "Jurgen Moser"
    id: "https://doi.org/10.1090/S0002-9947-1965-0182927-5"
    type: "paper"
    location: >-
      Trans. Amer. Math. Soc. 120 (1965), 286-294. The deformation method ("Moser's trick")
      that the proof uses. Not read for this entry.
    relationship: "background"
    author_endorsement: "n/a"
  - title: "Symplectic manifolds and their Lagrangian submanifolds"
    authors:
      - "Alan Weinstein"
    id: "https://doi.org/10.1016/0001-8708(71)90020-X"
    type: "paper"
    location: >-
      Adv. Math. 6 (1971), 329-346. Moser's method applied to symplectic forms. Not read for this
      entry.
    relationship: "background"
    author_endorsement: "n/a"
  - title: "Introduction to Symplectic Topology"
    authors:
      - "Dusa McDuff"
      - "Dietmar Salamon"
    id: "https://doi.org/10.1093/oso/9780198794899.001.0001"
    type: "book"
    location: >-
      3rd ed., Oxford University Press, 2017. Darboux's theorem (cited by csd-lean4 as Theorem
      3.2.2) and symplectic bases (Section 2.1), the textbook account of the proof. Not read for
      this entry.
    relationship: "background"
    author_endorsement: "n/a"
  - title: "Some Fundamental Theorems in Mathematics"
    authors:
      - "Oliver Knill"
    id: "https://people.math.harvard.edu/~knill/graphgeometry/papers/fundamental.pdf"
    type: "other"
    location: "Section 39, as cited by lean-eval's problem. Not read for this entry."
    relationship: "background"
    author_endorsement: "n/a"

related_formalizations:
  - id: "https://github.com/leanprover/lean-eval/blob/85a88c37f80170d9f08651dc63ce6b81a8a48cb9/generated/darboux/Challenge.lean"
    relationship: "builds-on"
    note: >-
      Supplies the statement: Kim Morrison's lean-eval problem darboux (added 25 May 2026;
      Copyright 2026 Lean FRO, LLC, Apache 2.0). Challenge.lean copies its ChallengeDeps.lean and
      Challenge.lean apart from the module header, @[expose] public section, moving the
      definitions into one file, and term proofs in place of omega for the bounds in idxP and
      idxQ (see fidelity); scripts/check-lean-eval-match.py checks this. lean-eval's v1 audit of
      20 Aug 2026 records four accepted solutions from four users, the first on 17 Jun 2026; I
      found none of them published, and this entry does not use them.
  - id: "https://github.com/zblore/csd-lean4/tree/8b99f249/CsdLean4/Mathlib"
    relationship: "builds-on"
    note: >-
      The proof. The 18 files under DarbouxLean/ other than Bridge.lean and Defs.lean are copied
      from csd-lean4 at commit 8b99f249, with imports renamed and their comments edited; the code
      is unchanged. The files were written from 11 Jul 2026; the Darboux proof itself (Darboux.lean,
      DarbouxStandardForm.lean, SymplecticBasis.lean) on 21-23 Sep 2026. csd-lean4 proves Darboux
      on a ball, C^k for 1 <= k <= infinity, and on a symplectic manifold. DarbouxLean/Bridge.lean
      derives lean-eval's statement from the ball version.
  - id: "https://github.com/t4v1/damian_formalizare/blob/545ebb1a7d4c55299b1f59787a7ff0d4d703af27/MorseFloer/Part2/Darboux.lean"
    relationship: "independent"
    note: >-
      MorseFloer.Darboux.darboux (16 Sep 2026), in a formalization of Audin and Damian's Morse
      Theory and Floer Homology: by Moser's method, a C^1 closed form on a finite-dimensional real
      space, non-degenerate at a point, is near that point the pullback of its constant value
      there. A different statement from lean-eval's (no standard form, no EuclideanSpace R
      (Fin (2n))). Not used here.
  - id: "https://github.com/TauCetiProject/TauCeti/blob/7ca783d4c8d324c9c74efaacd641c8a40f69f284/TauCeti/Geometry/Symplectic/Darboux/Basic.lean"
    relationship: "independent"
    note: >-
      Tau Ceti's Darboux theorem by Moser's method, first merged 19 Oct 2026 (PR #18754):
      exists_diffeomorph_eventually_compContinuousLinearMap_fderiv_eq, for a closed form on an
      open subset of a finite-dimensional real normed space. A different statement from
      lean-eval's. Not used here.
  - id: "https://github.com/TauCetiProject/TauCeti/blob/7ca783d4c8d324c9c74efaacd641c8a40f69f284/TauCeti/Geometry/Symplectic/Manifold/Darboux.lean"
    relationship: "independent"
    note: >-
      Tau Ceti's Darboux charts on symplectic manifolds (4 Nov 2026), including
      IsSymplectic.exists_standardDarbouxChart into EuclideanSpace R (Fin n) x EuclideanSpace R
      (Fin n). A different statement from lean-eval's. Not used here.
  - id: "https://github.com/facebookresearch/atlas-lean/blob/main/WantedExt/Geometry/DarbouxWanted.lean"
    relationship: "other"
    note: >-
      ATLAS lists lean-eval's statement as a wanted theorem, without a proof.

