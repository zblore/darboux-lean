      models:
        - "Claude Opus 4.8"
        - "Claude Fable 5"
        - "Claude Opus 5"
        - "Claude Fable 5.1"
        - "Claude Opus 5.5"
      framework: "Claude Code"
  notes: >-
    I drafted the Lean with Claude Code. The csd-lean4 commit trailers of the 18 copied files
    name Claude Opus 4.8 (1M context), Claude Fable 5, Claude Opus 5 (also in its 1M-context
    version), Claude Fable 5.1 and Claude Opus 5.5. For the Darboux proof itself, Claude Opus 5
    assembled Moser's proof (Darboux.lean, 21 Sep 2026), and Claude Fable 5.1 added the C^n chart
    and the standard form (Darboux.lean, DarbouxStandardForm.lean, SymplecticBasis.lean, 23 Sep
    2026). Claude Opus 5.5 ported the files and wrote the bridge to lean-eval's statement.

review:
  status: "self-assessed"
  notes: >-
    Checked locally (Windows): the build; scripts/check-lean-eval-match.py and its self-test,
    which regenerate Challenge.lean's code from lean-eval's two files at the pinned commit,
    apply exactly the two idxP and idxQ substitutions, pin both files by SHA-256 and confirm that
    21 altered inputs fail (a comparison of text, against lean-eval's Mathlib b63f6e8a rather
    than this repository's 5e0c4e52); a comparison of every constant that darboux's statement
    reaches in Challenge and in Solution, which match by name and term up to the names of bound
    variables (which Comparator ignores), with none private to Challenge or to this repository's
    modules; audit/Axioms.lean,
    which enforces with #guard_msgs that the main result and key lemmas use only propext,
    Classical.choice and Quot.sound; and audit/Control.lean, which checks that the audit detects
    sorryAx, that the hypotheses hold for the constant standard form in every dimension, and
    that the zero form is not in Darboux normal form. lake comparator needs Linux, so it runs in
    CI and in Palomar's own pipeline.

status:
  scope: >-
    A full proof of lean-eval's darboux. Apart from the placeholder in Challenge.lean, the only
    sorry is a deliberate control in audit/Control.lean, which Solution does not import.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - description: >-
        Every smooth, closed, non-degenerate 2-form on an open set of R^2n is, near each point,
        the pullback of the standard symplectic form by a smooth chart with smooth inverse.
      declaration: "darboux"
      file: "DarbouxLean/Bridge.lean"
      comparator_config: "comparator.json"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
    - description: >-
        Darboux on a ball in any finite-dimensional real normed space: a C^k form (1 <= k <=
        infinity), closed on the ball and non-degenerate at the centre, is the pullback of the
        standard form on R^2n by a C^k chart with C^k inverse, and the dimension is 2n.
      declaration: "exists_openPartialHomeomorph_pullback_standard"
      file: "DarbouxLean/Geometry/Manifold/DarbouxStandardForm.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"

fidelity:
  divergences: >-
    One, in the proofs inside two definitions. lean-eval proves the bounds in idxP and idxQ with
    `by have := i.isLt; omega`; Challenge.lean and Defs.lean use term proofs. omega leaves an
    auxiliary lemma private to its module, so the definitions in a second module would be
    different constants and Comparator would reject the match. Both versions give the same Fin
    values, so the statement means the same. Otherwise Challenge.lean is lean-eval's text, with
    its definitions moved into the file. It builds against Mathlib 5e0c4e52 rather than
    lean-eval's b63f6e8a, with the same Lean v4.35.0-rc3, so the check against lean-eval compares
    text, not elaborated terms.

alignment:
  namespaces:
    - "LeanEval.Geometry.Darboux"
    - "DarbouxLean"
  statements:
    - source: "lean-eval, darboux (Kim Morrison)"
      lean: "darboux"
      module: "DarbouxLean.Bridge"
      status: "proved"

acknowledgements: >-
  Thanks to Kim Morrison for the problem statement, and to the authors of Lean 4 and Mathlib.
